name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  ci:
    runs-on: ubuntu-latest
    env: { GOWORK: "off", GOPRIVATE: "github.com/netstar-labs" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build ./... && go vet ./...
      # Cross-compile gates: the windows fallback (file_other.go) and the
      # big-endian byte-order fallback (format.go) must at least keep building
      # — neither path executes on any machine we run tests on.
      - run: GOOS=windows go build ./... && GOOS=windows go vet ./...
      - run: GOOS=linux GOARCH=s390x go build ./...
      # Two test passes on purpose: the adversarial loops run at full count
      # here, and at reduced count under -race (see race_test.go) — the race
      # detector is hunting data races, not re-proving data-shape properties.
      - run: go test ./...
      - run: go test -race ./...
      # Pinned, not @latest: these have broken on toolchain releases before,
      # and a gate that can start failing with no change in the repo is not a
      # gate. Bump them deliberately, with the Go version.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      # deadcode exits 0 even when it finds something; only an empty report passes.
      - run: test -z "$(go run golang.org/x/tools/cmd/deadcode@v0.50.0 -test ./...)"
      - run: test -z "$(gofmt -l .)"
